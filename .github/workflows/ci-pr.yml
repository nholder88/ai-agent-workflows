name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run pack:test

      - name: Run E2E tests
        run: npm run pack:test:e2e

      - name: Validate template parity
        run: npm run templates:test-parity
